<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI ליוצרים: מפרומפט למוצר | AI for Builders</title>
    <!-- Google Fonts: Assistant for Hebrew, Fira Code for code snippets -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700;800&family=Fira+Code:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="ide-theme-vscode">
    <div class="app-container">
        <!-- Status Bar at the very bottom -->
        <footer class="ide-status-bar">
            <div class="status-left">
                <span class="status-item git-branch">
                    <svg class="icon" viewBox="0 0 16 16" width="14" height="14"><path fill="currentColor" d="M5 3.25a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0zm0 2.122a2.25 2.25 0 1 0-1.5 0v5.256a2.251 2.251 0 1 0 1.5 0V5.372zm-1.5 7.378a.75.75 0 1 1 1.5 0 .75.75 0 0 1-1.5 0zm9.25-9.5a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0zm0 2.122a2.25 2.25 0 1 0-1.5 0v5.256a2.251 2.251 0 1 0 1.5 0V5.372zm-1.5 7.378a.75.75 0 1 1 1.5 0 .75.75 0 0 1-1.5 0z"></path></svg>
                    <span>main</span>
                </span>
                <span class="status-item sync-status">
                    <svg class="icon spin" viewBox="0 0 16 16" width="14" height="14"><path fill="currentColor" d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.417A6 6 0 1 1 8 2v1z"></path><path fill="currentColor" d="M8 4.4a.5.5 0 0 1 .5.5v3a.5.5 0 0 1-.5.5H5a.5.5 0 0 1 0-1h2.5V4.9a.5.5 0 0 1 .5-.5z"></path></svg>
                    <span id="sync-text">מחובר ל-Antigravity</span>
                </span>
            </div>
            <div class="status-right">
                <span class="status-item">UTF-8</span>
                <span class="status-item">HTML/CSS/JS</span>
                <span class="status-item project-progress-percent">התקדמות הקורס: <strong id="progress-percent">0%</strong></span>
            </div>
        </footer>

        <!-- Main IDE Layout -->
        <main class="ide-workspace">
            
            <!-- 1. Activity Bar (RTL rightmost panel) -->
            <nav class="ide-activity-bar">
                <div class="activity-top">
                    <button class="activity-btn active" data-tab="explorer" title="סייר קבצים (שיעורים)">
                        <svg viewBox="0 0 16 16" width="24" height="24"><path fill="currentColor" d="M12.5 1h-9c-.8 0-1.5.7-1.5 1.5v11c0 .8.7 1.5 1.5 1.5h9c.8 0 1.5-.7 1.5-1.5v-11c0-.8-.7-1.5-1.5-1.5zm-.5 12h-8V3h8v10z"></path></svg>
                    </button>
                    <button class="activity-btn" id="btn-progress-sidebar" title="מדד התקדמות">
                        <svg viewBox="0 0 16 16" width="24" height="24"><path fill="currentColor" d="M8 0a8 8 0 1 0 8 8A8 8 0 0 0 8 0zm0 14.5a6.5 6.5 0 1 1 6.5-6.5 6.51 6.51 0 0 1-6.5 6.5zM9 4H7v5h5V7H9z"></path></svg>
                    </button>
                </div>
                <div class="activity-bottom">
                    <button class="activity-btn" id="btn-settings" title="הגדרות עיצוב">
                        <svg viewBox="0 0 16 16" width="24" height="24"><path fill="currentColor" d="M9.1 1.046a1 1 0 0 0-1.9 0l-.3 1.503a5.53 5.53 0 0 0-1.12.647l-1.393-.687a1 1 0 0 0-1.3.364l-1 1.732a1 1 0 0 0 .22 1.348l1.192.937a5.57 5.57 0 0 0 0 1.298l-1.192.937a1 1 0 0 0-.22 1.348l1 1.732a1 1 0 0 0 1.3.364l1.393-.687a5.53 5.53 0 0 0 1.12.647l.3 1.503a1 1 0 0 0 1.9 0l.3-1.503a5.53 5.53 0 0 0 1.12-.647l1.393.687a1 1 0 0 0 1.3-.364l1-1.732a1 1 0 0 0-.22-1.348l-1.192-.937a5.57 5.57 0 0 0 0-1.298l1.192-.937a1 1 0 0 0 .22-1.348l-1-1.732a1 1 0 0 0-1.3-.364l-1.393.687a5.53 5.53 0 0 0-1.12-.647L9.1 1.046zM8 11a3 3 0 1 1 0-6 3 3 0 0 1 0 6z"></path></svg>
                    </button>
                </div>
            </nav>

            <!-- 2. Sidebar (Explorer & Lessons List) -->
            <aside class="ide-sidebar" id="explorer-sidebar">
                <div class="sidebar-header">
                    <h3>סייר פרויקט</h3>
                </div>
                <div class="sidebar-section">
                    <div class="section-title">
                        <svg class="icon dropdown-icon" viewBox="0 0 16 16" width="12" height="12"><path fill="currentColor" d="M12.14 8.753l-5.482 4.796c-.646.566-1.658.106-1.658-.753V3.204a1 1 0 0 1 1.659-.753l5.48 4.796a1 1 0 0 1 0 1.506z"></path></svg>
                        <span>שיעורים (AI_FOR_BUILDERS)</span>
                    </div>
                    <ul class="file-list" id="lessons-list">
                        <!-- Populated by JS with locking logic -->
                    </ul>
                </div>

                <!-- Course Progress Visualizer inside Sidebar -->
                <div class="sidebar-section progress-section">
                    <div class="section-title">
                        <span>התקדמות הלימוד</span>
                    </div>
                    <div class="progress-container-sidebar">
                        <div class="progress-radial">
                            <svg class="progress-ring" width="80" height="80">
                                <circle class="progress-ring__circle-bg" stroke="#2d2d2d" stroke-width="6" fill="transparent" r="34" cx="40" cy="40"/>
                                <circle class="progress-ring__circle" id="radial-progress-bar" stroke="var(--accent-color)" stroke-width="6" fill="transparent" r="34" cx="40" cy="40"/>
                            </svg>
                            <div class="progress-text-center" id="radial-progress-text">0%</div>
                        </div>
                        <ul class="lesson-checkmarks" id="lesson-checkmarks-list">
                            <!-- Populated by JS -->
                        </ul>
                    </div>
                </div>
            </aside>

            <!-- 3. Main Editor Panel (Lesson content) -->
            <section class="ide-editor-container">
                <!-- Editor Tab Bar -->
                <div class="editor-tab-bar" id="tab-bar">
                    <!-- Populated by JS based on open tabs -->
                </div>
                <!-- Editor Code Content -->
                <div class="editor-content-area" id="editor-body">
                    <!-- HTML representation of lesson Markdown, styled like VS Code editor -->
                    <div class="editor-window">
                        <div class="line-numbers" id="editor-line-numbers">
                            <!-- Dynamic line numbers -->
                        </div>
                        <div class="code-viewport" id="editor-text-content">
                            <!-- Lesson Content in Hebrew, populated by JS -->
                        </div>
                    </div>
                </div>
            </section>

            <!-- 4. Split Panel (Left side in RTL: Sandbox & Terminal) -->
            <section class="ide-sandbox-container">
                <div class="panel-header">
                    <div class="tab active" id="tab-sandbox">משימה לביצוע (Action Item)</div>
                </div>
                
                <!-- Sandbox Content (contains action steps and inputs) -->
                <div class="sandbox-content" id="sandbox-viewport">
                    <!-- Dynamically injected action items (inputs/textareas) -->
                </div>

                <!-- Run Simulator Actions (Unified Submit buttons) -->
                <div class="sandbox-actions">
                    <button class="btn btn-primary" id="btn-run-code">
                        <svg viewBox="0 0 16 16" width="14" height="14" style="margin-left: 6px;"><path fill="currentColor" d="M12 2H4a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2zm-1 9H5V5h6v6z"></path></svg>
                        <span>אשר והשלם משימה (Verify Task)</span>
                    </button>
                    <button class="btn btn-secondary" id="btn-reset-sandbox">נקה קלט</button>
                </div>

                <!-- Integrated Terminal Panel (Bottom of sandbox area) -->
                <div class="ide-terminal-panel">
                    <div class="terminal-header">
                        <span class="terminal-title">מסוף אימות פרויקט (Verification Terminal)</span>
                        <div class="terminal-controls">
                            <button id="clear-terminal" title="נקה מסוף">
                                <svg viewBox="0 0 16 16" width="12" height="12"><path fill="currentColor" d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0-1A6 6 0 1 0 8 2a6 6 0 0 0 0 12zm2.854-8.854a.5.5 0 0 1 0 .708L8.707 8l2.147 2.146a.5.5 0 0 1-.708.708L8 8.707l-2.146 2.147a.5.5 0 0 1-.708-.708L7.293 8 5.146 5.854a.5.5 0 0 1 .708-.708L8 7.293l2.146-2.147a.5.5 0 0 1 .708 0z"></path></svg>
                            </button>
                        </div>
                    </div>
                    <div class="terminal-body" id="terminal-output">
                        <div class="terminal-line system-msg">מערכת אימות המשימות של Antigravity מוכנה...</div>
                    </div>
                </div>
            </section>

        </main>
    </div>

    <!-- Script loading -->
    <script src="app.js"></script>
</body>
</html>
